# Runs Appointly + PostgreSQL on your computer:   docker compose up --build
# Then open http://localhost:8000  (API docs: http://localhost:8000/docs)
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: appointly
      POSTGRES_PASSWORD: appointly
      POSTGRES_DB: appointly
    volumes:
      - appointly-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appointly"]
      interval: 3s
      retries: 20

  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://appointly:appointly@db:5432/appointly
    depends_on:
      db:
        condition: service_healthy

volumes:
  appointly-data:
