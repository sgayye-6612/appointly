# One-click deploy on Render: New > Blueprint > pick this repo.
services:
  - type: web
    name: appointly
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: appointly-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: appointly-db
    plan: free
